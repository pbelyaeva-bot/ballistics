name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linter (ruff)
        run: ruff check .

      - name: Generate convergence plot
        run: python docs/plot_convergence.py

      - name: Run tests (pytest)
        run: pytest

      - name: Commit updated plot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add docs/convergence.png
          git diff --staged --quiet || git commit -m "docs: update convergence plot [skip ci]"
          git push
